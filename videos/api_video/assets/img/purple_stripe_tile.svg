<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <defs>
    <linearGradient id="purpBg" x1="0" y1="0" x2="280" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="55%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <clipPath id="purpClip">
      <rect width="280" height="220" rx="52"/>
    </clipPath>
  </defs>
  <g clip-path="url(#purpClip)">
    <rect width="280" height="220" fill="url(#purpBg)"/>
    <!-- Crisp diagonal/horizontal layered stripes matching reference bottom-left icon -->
    <rect x="-20" y="28" width="320" height="20" rx="10" fill="rgba(196, 181, 253, 0.28)" transform="rotate(-7 140 110)"/>
    <rect x="-20" y="74" width="320" height="20" rx="10" fill="rgba(196, 181, 253, 0.24)" transform="rotate(-7 140 110)"/>
    <rect x="-20" y="120" width="320" height="20" rx="10" fill="rgba(196, 181, 253, 0.20)" transform="rotate(-7 140 110)"/>
    <rect x="-20" y="166" width="320" height="20" rx="10" fill="rgba(196, 181, 253, 0.16)" transform="rotate(-7 140 110)"/>
    <!-- White bottom semicircle peek -->
    <circle cx="140" cy="218" r="46" fill="#ffffff" fill-opacity="0.92"/>
  </g>
  <rect x="4" y="4" width="272" height="212" rx="48" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>
</svg>
